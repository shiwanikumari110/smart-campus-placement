<!DOCTYPE html>
<html><head><title>Create Drive</title>
<style>body{font-family:Arial;background:#f2f4f8} .card{background:white;max-width:500px;margin:40px auto;padding:25px;border-radius:10px} input{width:100%;padding:12px;margin:8px 0} button{background:#198754;color:white;padding:12px;width:100%;border:none;border-radius:6px;font-size:16px}</style>
</head><body><div class="card"><h2>Create Placement Drive</h2>
<form method="post">
<input name="title" placeholder="Job Title e.g. Python Developer" required>
<input name="desc" placeholder="Job Description e.g. Python, SQL required">
<input name="cgpa" placeholder="Min CGPA e.g. 6.5" required>
<input name="deadline" placeholder="Deadline e.g. 2026-12-31" required>
<button>Create Drive</button></form>
<p><a href="/dashboard">Back to Dashboard</a></p></div></body></html>
