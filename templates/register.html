<!DOCTYPE html>
<html><head><title>Register</title>
<style>body{font-family:Arial;background:#f2f4f8} .card{background:white;max-width:450px;margin:40px auto;padding:25px;border-radius:10px} input,select{width:100%;padding:12px;margin:8px 0} button{background:#198754;color:white;padding:12px;width:100%;border:none;border-radius:6px}</style>
</head><body><div class="card"><h2>Create Account</h2>
<form method="post">
<input name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<select name="role"><option value="Student">Student</option><option value="Company">Company</option><option value="Admin">Admin</option></select>
<input name="dept" placeholder="Department / Company Name">
<input name="cgpa" placeholder="CGPA (for Student)">
<button>Register</button></form>
<p><a href="/login">Already have account? Login</a></p></div></body></html>
