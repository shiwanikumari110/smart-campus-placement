<!DOCTYPE html><html><body style="font-family:Arial;padding:20px;max-width:500px;margin:auto"><h2>1. Student Profile</h2><form method="POST"><label>Name</label><br><input name="name" placeholder="Kumari Shiwani" required style="width:100%;padding:8px"><br><br><label>CGPA</label><br><input name="cgpa" placeholder="8.5" required style="width:100%;padding:8px"><br><br><label>Branch</label><br><input name="branch" placeholder="CSE / B.Tech" required style="width:100%;padding:8px"><br><br><label>Skills</label><br><input name="skills" placeholder="Python, SQL, HTML" required style="width:100%;padding:8px"><br><br><button type="submit" style="padding:10px 20px;background:green;color:white;border:none">Save Profile</button></form>{% if msg %}<h3 style="color:green">{{msg}}</h3><p>Name: {{student.name}} | CGPA: {{student.cgpa}} | Branch: {{student.branch}} | Skills: {{student.skills}}</p>{% endif %}<br><a href="/">Back to Dashboard</a></body></html>
